  <!-- Load sections -->

  <div id="toast"class="toast"role="status" aria-live="polite"
></div>
   <script>
  async function loadSection(containerId, filePath) {
    const container = document.getElementById(containerId);
    if (!container) {
      console.error(`Container not found: ${containerId}`);
      return;
    }
    try {
      const response = await fetch(filePath);
      if (!response.ok) {
        throw new Error(
          `Failed to load ${filePath}: ${response.status}`
        );
      }

      const html = await response.text();

      container.innerHTML = html;

      console.log(`Loaded successfully: ${filePath}`);

    } catch (error) {

      console.error(
        `Error loading ${filePath}:`,
        error
      );

      container.innerHTML = `
        <p style="padding: 100px 20px; color: red;">
          Failed to load ${filePath}
        </p>
      `;
    }
  }


  async function initializeAccountPage() {

    console.log('Initializing account page...');

    await loadSection(
      'account-section-wrapper',
      './sections/account.html'
    );

    await loadSection(
      'wishlist-section-wrapper',
      './sections/wishlist.html'
    );

    await loadSection(
      'cart-section',
      './sections/cart.html'
    );


    const script = document.createElement('script');

    script.src = './app.js';

    script.onload = () => {

      console.log('app.js loaded successfully');
 const loginForm =
    document.getElementById('login-form');

  const registerForm =
    document.getElementById('register-form');


  if (loginForm) {

    loginForm.addEventListener(
      'submit',
      async event => {

        event.preventDefault();

        console.log('Login form submitted');

        if (
          typeof window.handleLogin ===
          'function'
        ) {

          await window.handleLogin(event);

        } else {

          console.error(
            'handleLogin function was not found'
          );

        }

      }
    );

  }


  if (registerForm) {

    registerForm.addEventListener(
      'submit',
      async event => {

        event.preventDefault();

        console.log('Register form submitted');

        if (
          typeof window.handleRegister ===
          'function'
        ) {

          await window.handleRegister(event);

        } else {

          console.error(
            'handleRegister function was not found'
          );

        }

      }
    );

  }
    };
 
    script.onerror = () => {

      console.error('Failed to load app.js');

    };

    document.body.appendChild(script);
  }


  document.addEventListener(
    'DOMContentLoaded',
    initializeAccountPage
  );

  </script>
