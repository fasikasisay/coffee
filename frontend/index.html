<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <meta name="description" content="Misrak Coffee — Premium Ethiopian coffee export company. Green beans, roasted coffee, and worldwide shipping." />
  <title>Misrak Coffee — Premium Ethiopian Export</title>

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

  <!-- NAVBAR -->
  <header id="navbar" class="navbar" role="banner">

    <div class="container nav-container">

     <a href="#home" class="logo" aria-label="Misrak Coffee — Home">
         <img src="logo2.png" alt="Misrak Coffee Logo" class="logo-image">
        <span class="logo-text">Misrak <em>Coffee </em> </span>
      </a>


     <nav class="nav-links" aria-label="Primary Navigation">
  <a href="#home" class="nav-link active">Home</a>
  <a href="#about" class="nav-link">About</a>
  <a href="#menu" class="nav-link">Menu</a>
  <a href="#contact" class="nav-link">Contact</a>
</nav> 

      <div class="nav-actions">

  <!-- Theme Toggle -->
  <button
    id="themeToggle"
    class="theme-toggle"
    aria-label="Toggle dark/light mode"
    title="Toggle theme"
  >
    <span class="theme-icon theme-icon--sun" aria-hidden="true">
      <i class="fa-solid fa-sun"></i>
    </span>

    <span class="theme-icon theme-icon--moon" aria-hidden="true">
      <i class="fa-solid fa-moon"></i>
    </span>
  </button>

  <!-- Wishlist -->
  <a
    href="account.html#wishlist"
    class="nav-icon-link"
    aria-label="Wishlist"
    title="Wishlist"
  >
    <i class="fa-regular fa-heart"></i>
  </a>

  <!-- Cart -->
  <button
    id="cartToggle"
    class="cart-toggle"
    aria-label="Open shopping cart"
    title="View cart"
  >
    <i class="fa-solid fa-bag-shopping" aria-hidden="true"></i>
    <span
      id="cartBadge"
      class="cart-badge"
      aria-live="polite"
      aria-label="0 items in cart"
    >0</span>
  </button>

  <!-- Logged Out -->
  <div id="loggedOutAccount" class="nav-account-menu">
    <button
      type="button"
      class="nav-account-trigger nav-signin-trigger"
      id="signInTrigger"
      aria-expanded="false"
      aria-haspopup="true"
    >
      <i class="fa-solid fa-user"></i>
      <span>Sign In</span>
      <i class="fa-solid fa-chevron-down account-chevron"></i>
    </button>

    <div
      id="signInDropdown"
      class="nav-account-dropdown"
    >
      <a href="account.html#login" class="account-dropdown-link">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>Login</span>
      </a>

      <a href="account.html#register" class="account-dropdown-link">
        <i class="fa-solid fa-user-plus"></i>
        <span>Create Account</span>
      </a>
    </div>
  </div>

  <!-- Logged In -->
  <div
    id="loggedInAccount"
    class="nav-account-menu"
    style="display: none;"
  >
    <button
      type="button"
      class="nav-account-trigger"
      id="accountMenuTrigger"
      aria-expanded="false"
      aria-haspopup="true"
    >
      <span
        id="navAccountAvatar"
        class="nav-account-avatar"
      >M</span>

      <span
        id="navAccountName"
        class="nav-account-name"
      >Account</span>

      <i class="fa-solid fa-chevron-down account-chevron"></i>
    </button>

    <div
      id="accountDropdown"
      class="nav-account-dropdown"
    >
      <a href="account.html" class="account-dropdown-link">
        <i class="fa-regular fa-user"></i>
        <span>My Account</span>
      </a>

      <a href="account.html#orders" class="account-dropdown-link">
        <i class="fa-solid fa-box"></i>
        <span>My Orders</span>
      </a>

      <a href="account.html#wishlist" class="account-dropdown-link">
        <i class="fa-regular fa-heart"></i>
        <span>Wishlist</span>
      </a>

      <a href="account.html#settings" class="account-dropdown-link">
        <i class="fa-solid fa-gear"></i>
        <span>Settings</span>
      </a>

      <button
        type="button"
        id="navLogoutBtn"
        class="account-dropdown-link account-logout"
      >
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Logout</span>
      </button>
    </div>
  </div>

  <!-- Hamburger -->
  <button
    id="hamburger"
    class="hamburger"
    aria-label="Toggle mobile menu"
    aria-expanded="false"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

</div>
    <!-- MOBILE MENU -->
    <div id="mobileMenu" class="mobile-menu" role="navigation" aria-label="Mobile Navigation">
      <a href="#home" class="mobile-nav-link">Home</a>
      <a href="#about" class="mobile-nav-link">About</a>
      <a href="#menu" class="mobile-nav-link">Menu</a>
      
      <a href="#cartOverlay" class="mobile-nav-link">Order</a>
      <a href="account.html" class="mobile-nav-link" id="mobile-nav-account">Account</a>
      <a href="#contact" class="mobile-nav-link">Contact</a>
    </div>

  </header>

  <!-- HERO -->
   <section id="home" class="hero" aria-labelledby="heroHeading">
    <div class="hero-overlay" aria-hidden="true"></div>

    <div class="hero-content">
      <!-- Inline logo for hero -->
      <div class="hero-logo" aria-hidden="true">
    <img src="logo2.png" alt="Misrak Coffee Logo" class="logo-image-hero">
      </div>

      <p class="hero-eyebrow">Ethiopia's Finest Export</p>
      
      
      <p class="hero-subtitle">Dark &bull; Modern &bull; Authentic</p>

      <div class="hero-cta">
        <a href="#menu" class="btn btn--primary">
          Explore Menu
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </a>
        <a href="#about" class="btn btn--ghost">Our Story</a>
      </div>
    </div>

    <div class="hero-scroll" aria-hidden="true">
      <span></span>
    </div>
  </section>

  <!-- ABOUT -->

<div id="about-section"></div>

  <!-- PRODUCTS -->
<div id="products-section"></div>

<!-- SERVICES -->
<div id="services-section"></div>
  <!-- CONTACT -->
  
<div id="contact-section"></div>
  

 <!--  CART DRAWER-->
  
<div id="cart-section"></div>
  <!-- TOAST -->
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

 <script>
  async function loadSection(id, file) {
    const container = document.getElementById(id);

    if (!container) {
      console.error(`Container #${id} not found`);
      return;
    }

    try {
      const response = await fetch(file);

      if (!response.ok) {
        throw new Error(
          `Failed to load ${file}: ${response.status}`
        );
      }

      container.innerHTML = await response.text();

    } catch (error) {
      console.error(`Error loading ${file}:`, error);
    }
  }

  async function loadPageSections() {
    await Promise.all([
      loadSection('about-section', 'sections/about.html'),
      loadSection('products-section', 'sections/products.html'),
      loadSection('services-section', 'sections/services.html'),
      loadSection('contact-section', 'sections/contact.html'),
      loadSection('cart-section', 'sections/cart.html')
    ]);

    // Load app.js only after all sections are loaded
    const script = document.createElement('script');
    script.src = 'app.js';
    document.body.appendChild(script);
  }

  loadPageSections();
</script>

</body>

</html>
