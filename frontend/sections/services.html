<!-- SERVICES -->
<section
  id="services"
  class="menu-section"
  aria-labelledby="servicesHeading"
>

  <div class="container">

    <h2
      id="servicesHeading"
      class="section-title"
    >
      Our Services
    </h2>

    <div class="menu-slider-wrapper">

      <button
        class="slider-btn prev"
        id="servicePrev"
      >
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <div
        class="menu-slider"
        id="serviceGrid"
      ></div>

      <button
        class="slider-btn next"
        id="serviceNext"
      >
        <i class="fa-solid fa-chevron-right"></i>
      </button>

    </div>

  </div>

</section>
<!-- SERVICE ENQUIRY MODAL -->
<div
  id="serviceModal"
  class="modal"
  aria-hidden="true"
>
  <div
    class="modal__content service-modal__content"
    role="dialog"
    aria-modal="true"
    aria-labelledby="serviceModalTitle"
  >

    <div id="serviceContent"></div>

  </div>
</div>
