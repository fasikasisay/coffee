<!-- CONTACT -->
<section
  id="contact"
  class="contact-section"
  aria-labelledby="contactHeading"
>

  <div class="container">

    <div class="contact-header">

      <span class="section-eyebrow">
        Export inquiries
      </span>

      <h2
        id="contactHeading"
        class="section-title"
      >
        Contact Misrak Coffee
      </h2>

      <div
        class="contact-socials"
        aria-label="Social links"
      >

        <a
          href="https://www.linkedin.com/in/fasika-sisay-778663348/"
          target="_blank"
          rel="noopener"
          class="social-link"
          aria-label="LinkedIn"
        >
          <i
            class="fa-brands fa-linkedin-in"
            aria-hidden="true"
          ></i>
        </a>

        <a
          href="https://instagram.com/fa_fi_22"
          target="_blank"
          rel="noopener"
          class="social-link"
          aria-label="Instagram"
        >
          <i
            class="fa-brands fa-instagram"
            aria-hidden="true"
          ></i>
        </a>

        <a
          href="https://t.me/fasikawit"
          target="_blank"
          rel="noopener"
          class="social-link"
          aria-label="Telegram"
        >
          <i
            class="fa-brands fa-telegram"
            aria-hidden="true"
          ></i>
        </a>

      </div>

    </div>


    <div class="contact-container">

      <div class="contact-left">

        <div class="company-contact">

          <h3>
            Get in Touch
          </h3>

          <p class="contact-intro">
            We'd love to hear from you! Reach out to us with any questions or inquiries.
          </p>

          <ul class="contact-info">

            <li>

              <i
                class="fa-solid fa-phone"
                aria-hidden="true"
              ></i>

              <div>

                <span>
                  Phone
                </span>

                <a href="tel:+251912345678">
                  +251 912 345 678
                </a>

              </div>

            </li>


            <li>

              <i
                class="fa-solid fa-envelope"
                aria-hidden="true"
              ></i>

              <div>

                <span>
                  Email
                </span>

                <a href="mailto:info@misrakcoffee.com">
                  info@misrakcoffee.com
                </a>

              </div>

            </li>


            <li>

              <i
                class="fa-solid fa-location-dot"
                aria-hidden="true"
              ></i>

              <div>

                <span>
                  Location
                </span>

                <strong>
                  Addis Ababa, Ethiopia
                </strong>

              </div>

            </li>

          </ul>

        </div>

      </div>


      <div class="contact-right">

        <h3>
          Send a Message
        </h3>

        <form
          id="contactForm"
          class="contact-form"
          novalidate
        >

          <div class="form-group">

            <label for="cName">
              Full Name
              <span aria-hidden="true">*</span>
            </label>

            <input
              type="text"
              id="cName"
              name="name"
              placeholder="Your full name"
              autocomplete="name"
              aria-describedby="cNameError"
              aria-invalid="false"
            />

            <span
              id="cNameError"
              class="field-error"
              aria-live="polite"
            ></span>

          </div>


          <div class="form-group">

            <label for="cEmail">
              Email Address
              <span aria-hidden="true">*</span>
            </label>

            <input
              type="email"
              id="cEmail"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              aria-describedby="cEmailError"
              aria-invalid="false"
            />

            <span
              id="cEmailError"
              class="field-error"
              aria-live="polite"
            ></span>

          </div>


          <div class="form-group">

            <label for="cMessage">
              Message
              <span aria-hidden="true">*</span>
            </label>

            <textarea
              id="cMessage"
              name="message"
              placeholder="Tell us about your coffee needs..."
              aria-describedby="cMessageError"
              aria-invalid="false"
            ></textarea>

            <span
              id="cMessageError"
              class="field-error"
              aria-live="polite"
            ></span>

          </div>


          <button
            id="submitBtn"
            type="submit"
            class="btn btn--primary btn--full"
          >
            <span class="btn-text">
              Send Message
            </span>

            <span
              class="btn-loader"
              aria-hidden="true"
            ></span>
          </button>


          <div id="contactSuccess" hidden></div>

          <div id="contactError" hidden></div>

        </form>

      </div>

    </div>

  </div>

</section>
