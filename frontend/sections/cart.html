<!-- CART DRAWER -->

<div
  id="cartOverlay"
  class="cart-overlay"
  aria-hidden="true"
></div>


<aside
  id="cartDrawer"
  class="cart-drawer"
  role="dialog"
  aria-modal="true"
  aria-label="Shopping cart"
  aria-hidden="true"
>

  <div class="cart-drawer__header">

    <h2 class="cart-drawer__title">

      <i
        class="fa-solid fa-bag-shopping"
        aria-hidden="true"
      ></i>

      Your Cart

      <span
        id="cartCount"
        class="cart-drawer__count"
      >
        0 items
      </span>

    </h2>

    <button
      id="closeCart"
      class="cart-drawer__close"
      aria-label="Close cart"
    >
      <i
        class="fa-solid fa-xmark"
        aria-hidden="true"
      ></i>
    </button>

  </div>


  <div
    id="cartItems"
    class="cart-drawer__items"
    aria-live="polite"
  ></div>


  <div class="cart-drawer__footer">

    <div class="cart-subtotal">

      <span>
        Subtotal
      </span>

      <span id="cartTotalAmount">
        $0.00
      </span>

    </div>

    <p class="cart-note">
      Shipping & taxes calculated at checkout
    </p>

    <button
      id="checkoutBtn"
      class="btn btn--primary btn--full"
    >
      Proceed to Checkout

      <i
        class="fa-solid fa-arrow-right"
        aria-hidden="true"
      ></i>
    </button>

    <button
      id="continueShopping"
      class="btn btn--ghost btn--full"
    >
      Continue Shopping
    </button>

  </div>
</aside>
<!-- CHECKOUT MODAL -->
<div
  id="checkoutModal"
  class="modal"
  aria-hidden="true"
>
  <div
    class="modal__content checkout-modal__content"
    role="dialog"
    aria-modal="true"
    aria-labelledby="checkoutTitle"
  >

    <button
      id="closeCheckout"
      class="modal__close"
      type="button"
      aria-label="Close checkout"
    >
      <i
        class="fa-solid fa-xmark"
        aria-hidden="true"
      ></i>
    </button>

    <h2 id="checkoutTitle" class="modal__title">
      Checkout Details
    </h2>

    <p class="modal__subtitle">
      Please provide your details before proceeding to payment.
    </p>

    <form id="checkoutForm">

      <div class="form-group">
        <label for="customerName">
          Full Name
        </label>

        <input
          type="text"
          id="customerName"
          name="name"
          placeholder="Enter your full name"
          required
        >
      </div>


      <div class="form-group">
        <label for="customerEmail">
          Email Address
        </label>

        <input
          type="email"
          id="customerEmail"
          name="email"
          placeholder="Enter your email address"
          required
        >
      </div>


      <div class="form-group">
        <label for="customerPhone">
          Phone Number
        </label>

        <input
          type="tel"
          id="customerPhone"
          name="phone"
          placeholder="Enter your phone number"
        >
      </div>


      <div class="form-group">
        <label for="customerCompany">
          Company
        </label>

        <input
          type="text"
          id="customerCompany"
          name="company"
          placeholder="Enter your company name (optional)"
        >
      </div>


      <div class="form-group">
        <label for="customerCountry">
          Country
        </label>
        <input type="text" id="customerCountry" name="country" placeholder="Enter your country">
      </div>

      <div class="form-group">
        <label for="customerStreet">Street Address</label>
        <input type="text" id="customerStreet" name="street" placeholder="Enter street address">
      </div>

      <div class="form-group">
        <label for="customerCity">City</label>
        <input type="text" id="customerCity" name="city" placeholder="Enter city">
      </div>

      <div class="form-group">
        <label for="customerPostal">Postal Code</label>
        <input type="text" id="customerPostal" name="postalCode" placeholder="Enter postal code">
      </div>


      <button
        type="submit"
        class="btn btn--primary btn--full"
      >
        Continue to Payment

        <i
          class="fa-solid fa-arrow-right"
          aria-hidden="true"
        ></i>
      </button>

    </form>

  </div>
</div>
<!-- PAYMENT MODAL -->
<div
  id="paymentModal"
  class="modal"
  aria-hidden="true"
>
  <div
    class="modal__content payment-modal__content"
    role="dialog"
    aria-modal="true"
    aria-labelledby="paymentTitle"
  >

    <button
      id="closePayment"
      class="modal__close"
      type="button"
      aria-label="Close payment"
    >
      <i
        class="fa-solid fa-xmark"
        aria-hidden="true"
      ></i>
    </button>

    <h2 id="paymentTitle" class="modal__title">
      Choose Payment Method
    </h2>

    <p class="modal__subtitle">
      Select your preferred payment method.
    </p>


    <div
      class="payment-methods"
      role="radiogroup"
      aria-label="Payment methods"
    >

      <!-- Telebirr -->
      <button
        type="button"
        class="payment-card"
        data-method="telebirr"
        role="radio"
        aria-checked="false"
      >
        <i
          class="fa-solid fa-mobile-screen-button"
          aria-hidden="true"
        ></i>

        <span>
          Telebirr
        </span>
      </button>


      <!-- CBE Birr -->
      <button
        type="button"
        class="payment-card"
        data-method="cbe-birr"
        role="radio"
        aria-checked="false"
      >
        <i
          class="fa-solid fa-building-columns"
          aria-hidden="true"
        ></i>

        <span>
          CBE Birr
        </span>
      </button>


      <!-- Visa / Mastercard -->
      <button
        type="button"
        class="payment-card"
        data-method="card"
        role="radio"
        aria-checked="false"
      >
        <i
          class="fa-solid fa-credit-card"
          aria-hidden="true"
        ></i>

        <span>
          Visa / Mastercard
        </span>
      </button>


      <!-- Cash -->
      <button
        type="button"
        class="payment-card"
        data-method="cash"
        role="radio"
        aria-checked="false"
      >
        <i
          class="fa-solid fa-money-bill-wave"
          aria-hidden="true"
        ></i>

        <span>
          Cash
        </span>
      </button>

    </div>


    <button
      id="payNowBtn"
      type="button"
      class="btn btn--primary btn--full"
    >
      Confirm Order

      <i
        class="fa-solid fa-check"
        aria-hidden="true"
      ></i>
    </button>

  </div>
</div>
