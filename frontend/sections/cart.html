<!-- CART DRAWER -->

<div
  id="cartOverlay"
  class="cart-overlay"
  aria-hidden="true"
></div>


<aside
  id="cartDrawer"
  class="cart-drawer"
  role="dialog"
  aria-modal="true"
  aria-label="Shopping cart"
  aria-hidden="true"
>

  <div class="cart-drawer__header">

    <h2 class="cart-drawer__title">

      <i
        class="fa-solid fa-bag-shopping"
        aria-hidden="true"
      ></i>

      Your Cart

      <span
        id="cartCount"
        class="cart-drawer__count"
      >
        0 items
      </span>

    </h2>

    <button
      id="closeCart"
      class="cart-drawer__close"
      aria-label="Close cart"
    >
      <i
        class="fa-solid fa-xmark"
        aria-hidden="true"
      ></i>
    </button>

  </div>


  <div
    id="cartItems"
    class="cart-drawer__items"
    aria-live="polite"
  ></div>


  <div class="cart-drawer__footer">

    <div class="cart-subtotal">

      <span>
        Subtotal
      </span>

      <span id="cartTotalAmount">
        $0.00
      </span>

    </div>

    <p class="cart-note">
      Shipping & taxes calculated at checkout
    </p>

    <button
      id="checkoutBtn"
      class="btn btn--primary btn--full"
    >
      Proceed to Checkout

      <i
        class="fa-solid fa-arrow-right"
        aria-hidden="true"
      ></i>
    </button>

    <button
      id="continueShopping"
      class="btn btn--ghost btn--full"
    >
      Continue Shopping
    </button>

  </div>

</aside>
